# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: umd-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://hadezkz002.github.io
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: MAX_DOWNLOAD_SIZE_MB
        value: "150"
      - key: MAX_PLAYLIST_ITEMS
        value: "25"
      - key: MAX_VIDEO_DURATION
        value: "1800"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "8"
      - key: MAX_ACTIVE_JOBS_PER_IP
        value: "2"
      - key: JOB_TIMEOUT
        value: "900"
      - key: FILE_TTL
        value: "1800"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: JOB_RATE_LIMIT_PER_HOUR
        value: "15"
