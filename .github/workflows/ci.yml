name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: JavaScript syntax check
        run: node --check frontend/app.js && node --check frontend/config.js
      - name: Build site
        run: API_BASE_URL=https://example.invalid ./scripts/build-frontend.sh _site && test -s _site/index.html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t umd-api backend
      - name: Container health and tool check
        run: |
          docker run -d --name api -p 8000:8000 umd-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ffmpeg'] and d['js_runtime'] == ['deno'], d; print(d)"
          docker exec api python -m yt_dlp --version
          docker exec api deno --version
