name: Production smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy frontend"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: https://hadezkz002.github.io/universal-media-downloader/
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wake backend and check health
        run: |
          for i in $(seq 1 20); do curl -fsS --max-time 30 "$API_BASE_URL/api/health" && exit 0; sleep 10; done; exit 1
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser smoke test (desktop + Android viewport)
        run: python tests/ui_smoke.py "$FRONTEND_URL" screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots
