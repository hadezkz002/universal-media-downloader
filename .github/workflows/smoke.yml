name: Production smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy frontend"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: https://hadezkz002.github.io/universal-media-downloader/
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wait until the backend runs this commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -fsS --max-time 30 "$API_BASE_URL/api/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" || true)
            echo "backend commit: ${commit:-unknown}"
            [ -n "$commit" ] && [ "${SHA#"$commit"}" != "$SHA" ] && exit 0
            sleep 20
          done
          echo "Backend did not deploy ${SHA} in time"; exit 1
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser smoke test (desktop + Android viewport)
        run: python tests/ui_smoke.py "$FRONTEND_URL" screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots
